# descubrimiento.
nombre = "Switch D-Link"
categoria = "switch_administrable"
icono = "lan"
descripcion = "Switch D-Link administrable (familias DGS y DES)."

[coincidencias]
modelo_contiene = ["dgs-", "des-"]
