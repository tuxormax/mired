# Aceptar SSH dice que adentro hay un Unix, y nada mas: tambien lo aceptan las
# antenas, los routers, los NAS y los grabadores de video. Es GENERICA: si el
# fabricante o cualquier otra senal identifican el aparato, esa manda.
nombre = "Equipo Linux o Unix"
categoria = "computadora"
icono = "terminal"
descripcion = "Acepta conexiones SSH, asi que adentro corre un Unix. Eso no dice si es una PC, un router o una antena: lo dice el fabricante o su pagina."
generico = true

[coincidencias]
puertos_todos = [22]
banner_contiene = ["ssh", "openssh"]
