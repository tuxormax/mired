# Historial de versiones de MiRed.
#
# **Este archivo es la fuente de la verdad de la version.** De aqui salen tres
# cosas, y por eso no se toca a la ligera:
#
#   1. La version y la revision con que se compilan los binarios
#      (`herramientas/construir.sh` lee la ultima entrada; ya no se teclean).
#   2. Las filas de la tabla `versionessistema`, que el servidor siembra al
#      arrancar y el programa muestra al pulsar el pie.
#   3. Lo mismo para `versiondb` con los cambios de esquema.
#
# En los proyectos PHP de la casa esto vive en un seeder SQL. Aqui no puede: el
# `.deb` se instala en equipos donde no hay ningun SQL que correr a mano, asi que
# el historial viaja DENTRO del binario y se siembra solo.
#
# # Las reglas del versionado
#
#   version = 1.X   donde X es el NUMERO DE MODULOS del sistema. No es
#                   versionado semantico: X no sube porque un cambio sea grande,
#                   sube cuando hay un modulo mas.
#   revision        sube +1 en cada entrega y NUNCA se reinicia, tampoco al
#                   cambiar de version.
#   tipo            feature | fix | ajuste | change
#
# Los 19 modulos de la v1.19: redes, subredes, equipos, escaneo y agenda,
# presencia, mapa de puertos, mapa visual, alertas, consumo, inspeccion profunda,
# usuarios, credenciales SNMP, controladoras WiFi, catalogo de dispositivos,
# topologia manual, catalogo comunitario, barrido de aire, enlaces inalambricos
# y credenciales de equipo.

# --------------------------------------------------------------- el sistema --

[[sistema]]
version = "1.14"
revision = 1
fecha = "2026-08-12"
tipo = "feature"
modulo = "Cimientos"
notas = "Servidor y sonda con privilegios separados, una base SQLite por red, autenticacion con permisos por red, API con el estandar de errores de la casa y paquete .deb."

[[sistema]]
version = "1.14"
revision = 2
fecha = "2026-08-12"
tipo = "feature"
modulo = "Escaneo, presencia y agenda"
notas = "Descubrimiento por ARP, ICMP y TCP con puertos, DNS inverso y fabricante por OUI. Barrido rapido de presencia con su propio ritmo, historial de conexiones y barridos programados por red."

[[sistema]]
version = "1.14"
revision = 3
fecha = "2026-08-12"
tipo = "feature"
modulo = "Mapa de puertos"
notas = "SNMP v1/v2c/v3, tabla de MAC del switch, LLDP y perfil de capacidades por red. Distingue el puerto confirmado del grupo que cuelga de un switch no administrable."

[[sistema]]
version = "1.14"
revision = 4
fecha = "2026-08-12"
tipo = "feature"
modulo = "Catalogo, alertas y consumo"
notas = "Catalogo abierto de dispositivos en .toml con 15 definiciones semilla. Seis reglas de alerta con avisos a ntfy, Telegram, correo y webhook. Consumo por contadores SNMP y por flujos NetFlow v5."

[[sistema]]
version = "1.14"
revision = 5
fecha = "2026-08-13"
tipo = "feature"
modulo = "Mapa visual"
notas = "Exportacion del mapa a PNG, SVG, PDF y CSV. El SVG y el PDF se escriben a mano, sin biblioteca de terceros. Licencia AGPL-3.0."

[[sistema]]
version = "1.14"
revision = 6
fecha = "2026-08-13"
tipo = "feature"
modulo = "Mapa de puertos y consumo"
notas = "CDP junto a LLDP y los enlaces entre switches dibujados en el mapa. El receptor de flujos entiende ahora NetFlow v9, IPFIX y sFlow, y reconoce el formato solo. sFlow se marca como estimacion porque muestrea."

[[sistema]]
version = "1.14"
revision = 7
fecha = "2026-08-13"
tipo = "feature"
modulo = "Controladoras WiFi"
notas = "Controladora UniFi: el WiFi aparece en el mapa colgando de su antena, con el nombre de la red a la que se conecto cada equipo."

[[sistema]]
version = "1.14"
revision = 8
fecha = "2026-08-13"
tipo = "feature"
modulo = "Inspeccion profunda"
notas = "Que aplicacion consume, no solo cuanto. Sin descifrar nada: nombre del servidor por TLS, cabecera Host de HTTP y consultas de DNS. Viene apagada."

[[sistema]]
version = "1.14"
revision = 9
tipo = "change"
fecha = "2026-08-13"
modulo = "Usuarios"
notas = "Se quitaron las credenciales de fabrica: el administrador se crea en el primer acceso, con el usuario y la clave que elija quien instala. Las claves pasan a guardarse con el algoritmo TUXOR sobre scrypt."

[[sistema]]
version = "1.14"
revision = 10
fecha = "2026-08-13"
tipo = "change"
modulo = "Programa de escritorio"
notas = "MiRed deja de ser un servicio con interfaz web y pasa a ser un programa: aparece en el menu, levanta sus servicios al abrirse y los mata al cerrarse. Los datos van a la carpeta del usuario."

[[sistema]]
version = "1.14"
revision = 11
fecha = "2026-08-13"
tipo = "fix"
modulo = "Usuarios"
notas = "La pantalla del primer acceso se quedaba en gris al teclear el usuario: una expresion regular armada con la lista de signos de TUXOR leia el guion como un rango invalido. Agregado el cuarto candado de errores, que muestra los fallos de dibujo en vez de dejar la ventana muda."

[[sistema]]
version = "1.14"
revision = 12
fecha = "2026-08-13"
tipo = "ajuste"
modulo = "Redes"
notas = "El formulario de nueva red ya no pide una subred en notacion con barra: propone la red detectada y entiende rangos, direcciones sueltas y la notacion de siempre, diciendo lo que entendio antes de crear nada."

[[sistema]]
version = "1.14"
revision = 13
fecha = "2026-08-13"
tipo = "change"
modulo = "Redes"
notas = "Crear una red pide solo nombre y descripcion. Al escanear, MiRed adopta la red de este equipo y lo dice; antes se podia crear una red sin nada que escanear y el barrido no encontraba nada sin explicar por que. Error propio para cuando el equipo no esta conectado a ninguna red."

[[sistema]]
version = "1.14"
revision = 14
fecha = "2026-08-13"
tipo = "feature"
modulo = "Redes"
notas = "Boton para eliminar una red, con la opcion de borrar tambien sus datos del disco. Por omision el borrado es recuperable: el archivo se conserva y volver a crear la red con el mismo nombre la revive."

[[sistema]]
version = "1.14"
revision = 15
fecha = "2026-08-13"
tipo = "feature"
modulo = "Mapa visual"
notas = "Todo reporte dice de cuando son los datos, no solo cuando se exporto: los cuatro formatos del mapa y el CSV. En pantalla, cuando fue el ultimo escaneo se lee como 'hace 3 dias' y en rojo cuando ya no es de fiar."

[[sistema]]
version = "1.14"
revision = 16
fecha = "2026-08-13"
tipo = "fix"
modulo = "Programa de escritorio"
notas = "Al actualizar sin cerrar el programa, el servidor viejo seguia vivo con su codigo en memoria y el programa se colgaba de el: interfaz nueva contra motor viejo. Ahora el instalador para los procesos al actualizar y el programa compara su version con la del servidor vivo, reemplazandolo si no coinciden. Solo toca lo de este equipo."

[[sistema]]
version = "1.14"
revision = 17
fecha = "2026-08-13"
tipo = "change"
modulo = "Mapa de puertos"
notas = "MiRed averigua solo si hay switches administrables: en cada escaneo prueba la comunidad de fabrica, sin pedir nada. Si nadie contesta lo dice claro —son switches simples, es lo normal en una red de casa— en vez de pedir una credencial SNMP para unos switches que no existen."

[[sistema]]
version = "1.15"
revision = 18
fecha = "2026-08-14"
tipo = "feature"
modulo = "Topologia manual"
notas = "El modulo 15: lo que el usuario declara porque tiene el cable delante. Se pueden dar de alta aparatos que ningun escaneo ve —un switch no administrable no tiene direccion—, declarar las bocas de cualquier equipo y conectarlas a mano desde el mapa, con un modo edicion aparte de solo mirarlo. Lo declarado se dibuja punteado en pantalla y en los cuatro formatos exportados, y cuando el switch acaba contestando algo distinto se avisa de la contradiccion en vez de pisar en silencio ninguna de las dos versiones."

[[sistema]]
version = "1.15"
revision = 19
fecha = "2026-08-14"
tipo = "fix"
modulo = "Mapa visual y Alertas"
notas = "Salio de usar el programa en un equipo de verdad. El boton de editar el cableado era un lapiz suelto entre otros dos iconos y no lo encontro nadie: ahora va con su nombre y, sobre todo, esta en la pestana de Puertos, que es donde va la mano de quien quiere tocar el cableado. En las alertas, el cartelito 'Nueva' solo repetia lo que ya decia la negrita del titulo y no dejaba hacer nada: ahora es un boton para despachar esa alerta sola, con la cuenta de las que quedan sin ver siempre a la vista. Y la campanita de la red se quedaba con el numero del momento en que se abrio la pantalla: habia que salir al panel de inicio y volver a entrar para verla bien."

[[sistema]]
version = "1.15"
revision = 20
fecha = "2026-08-14"
tipo = "feature"
modulo = "Equipos y catalogo"
notas = "La lista de equipos dice ahora de que esta hecha la red: cuantos aparatos hay en total, cuantos estan prendidos y cuantos de cada tipo. Detras hay una LISTA UNICA de categorias que usan los dos lados: el catalogo clasifica con ella lo que descubre y el formulario de alta manual la ofrece en un desplegable, nunca como texto libre. Antes el catalogo decia 'punto_de_acceso' y el alta manual decia 'ap': el contador habria sacado dos cubos para la misma cosa. Una prueba compara las dos listas y falla si se separan. El switch declarado a mano cuenta desde el momento en que se declara, porque el contador y el mapa leen la misma tabla."

[[sistema]]
version = "1.15"
revision = 21
fecha = "2026-08-15"
tipo = "change"
modulo = "Vocabulario"
notas = "Lo que se llamaba boca ahora se llama PUERTO en todo el sistema: pantallas, mensajes, columnas y codigo. La palabra rara nacio para no confundir el conector fisico con un puerto TCP, pero el sistema ya decia puerto en las tablas y en el mapa, asi que solo servia para tener dos nombres para la misma cosa. Donde los dos sentidos puedan confundirse se dice PUERTO FISICO y PUERTO TCP, con todas sus letras."

[[sistema]]
version = "1.15"
revision = 22
fecha = "2026-08-15"
tipo = "feature"
modulo = "Catalogo de dispositivos"
notas = "MiRed ya sabe de quien es cada MAC: el paquete instala la lista completa de la IEEE —52 977 prefijos, incluidos los bloques chicos de 28 y 36 bits— en vez de los 99 que traia embebidos, y gana el prefijo mas largo que coincida. Ademas, una regla generica ya no le gana a una identificacion: tener el puerto 80 abierto describe un sintoma, no un aparato, y por eso el modem, la television y la antena salian los tres como Servidor web. Ahora eso solo se dice cuando no se sabe nada mejor, y se dice como lo que es: equipo con pagina web."

[[sistema]]
version = "1.15"
revision = 23
fecha = "2026-08-15"
tipo = "fix"
modulo = "Escaneo"
notas = "El equipo donde corre MiRed ya aparece en su propio inventario. Nadie se manda un ARP a su propia direccion y su respuesta al ping va por dentro sin salir a la red, asi que la PC del usuario era el unico aparato de la casa que faltaba. No hace falta preguntarselo a nadie: sus tarjetas dicen su IP, su MAC y su nombre, y se anota con el metodo propio, que es el dato mas firme de todos."

[[sistema]]
version = "1.15"
revision = 24
fecha = "2026-08-15"
tipo = "fix"
modulo = "Mapa y topologia manual"
notas = "Un cable ocupa un puerto en las DOS puntas: al conectar contra un aparato que tiene puertos declarados, ahora se pregunta en cual entra. Un switch de cinco puertos colgado del modem queda con cuatro libres, no con cinco. Y cada aparato se dibuja UNA vez: el switch que cuelga del modem va debajo de su puerto con los suyos abajo, en vez de salir dos veces —una como caja y otra como bloque suelto—. En la lista de equipos la IP se lee del tamano del renglon de abajo, porque es lo que identifica a un aparato en la red."

[[sistema]]
version = "1.15"
revision = 25
fecha = "2026-08-15"
tipo = "feature"
modulo = "Reconocimiento de aparatos"
notas = "MiRed ya no adivina que es un aparato mirandole los puertos: se lo pregunta. Lee el titulo y el encabezado de su pagina web, el nombre del candado que pide para entrar, el nombre y la organizacion de su certificado, y su banner de SSH. Escucha lo que la red anuncia sola —mDNS/Bonjour, UPnP y WS-Discovery— y habla los protocolos propios de las marcas que mas se venden aqui: Ubiquiti (que ademas contesta el SSID que emite y la MAC de su radio), MikroTik, TP-Link Kasa, Hikvision, Roku, televisiones Samsung, impresoras por IPP y el nombre de Windows por NetBIOS. Todo se guarda con la FUENTE de donde salio, para poder decir de donde se supo cada cosa en vez de presentarlo todo como igual de firme. Nada de esto entra a ningun lado: son los mismos mensajes que usan las aplicaciones de cada fabricante para encontrar sus equipos."

[[sistema]]
version = "1.16"
revision = 26
fecha = "2026-08-15"
tipo = "feature"
modulo = "Catalogo comunitario"
notas = "El modulo 16: lo que una persona aprende de su red, aprovechable por las demas. Un aparato que MiRed no reconocio se puede guardar en el catalogo de aqui —queda reconocido desde el proximo escaneo, sin reiniciar nada— y compartirse con la comunidad: MiRed deja el aporte ya escrito contra el repositorio y quien lo publica es la persona, con su cuenta. Y al reves: se pueden traer las definiciones que publicaron los demas, que se guardan en su propia carpeta. **Las tres mandan en orden: paquete, comunidad, propias.** Actualizar nunca pisa una definicion escrita aqui, porque quien tiene el aparato delante sabe mas que ningun repositorio. Corriendo como programa, lo propio y lo de la comunidad se escriben en la carpeta del usuario: en /etc no hay permiso."

[[sistema]]
version = "1.17"
revision = 27
fecha = "2026-08-15"
tipo = "feature"
modulo = "Barrido de aire"
notas = "El modulo 17: la unica medicion de MiRed que no pasa por un cable. Escucha que redes inalambricas se oyen desde el equipo y dice, de cada antena, el SSID que emite, el BSSID —que es la MAC del RADIO, distinta de la del cable—, el canal, la banda, la seguridad y con que fuerza llega. Cada antena se cruza con el inventario para decir de que aparato es, distinguiendo lo MEDIDO (la MAC del radio es la del equipo) de lo DEDUCIDO (esta a uno o dos numeros de la del cable, que es como numeran casi todos los fabricantes). Hace falta tarjeta WiFi en el equipo: cuando no la hay se dice con esas palabras, en vez de una lista vacia que se leeria como que no hay redes. No se barre solo al abrir la pestana, porque recorrer los canales corta unos segundos el WiFi de ese equipo."

[[sistema]]
version = "1.17"
revision = 28
fecha = "2026-08-15"
tipo = "feature"
modulo = "Reconocimiento de aparatos"
notas = "Se completan los protocolos de fabricante que faltaban: Tuya / Smart Life (los focos y enchufes, que no contestan a nada: **avisan solos** por difusion y hay que estar escuchando), TP-Link Omada, D-Link, NETGEAR NSDP, Dahua DHDiscover, Xiaomi miIO, Ruckus y Fortinet. Fortinet no tiene descubrimiento abierto: se reconoce por su certificado —que trae el numero de serie, y de ahi sale el modelo— y por el puerto 541 de gestion. De los protocolos que solo se conocen por ingenieria inversa se lee lo que se entiende y nada mas: si el aparato contesta con su modelo dentro, se saca; si contesta otra cosa, no se inventa. Trece definiciones nuevas de catalogo, incluidas FortiGate, FortiAP, Ruckus, Omada, switches D-Link y NETGEAR por su modelo, Tuya y Dahua."

[[sistema]]
version = "1.18"
revision = 29
fecha = "2026-08-15"
tipo = "feature"
modulo = "Enlaces inalambricos"
notas = "El modulo 18: quien cuelga de que antena. El WiFi no tiene puertos, asi que a una antena se le cuelgan UNO O VARIOS equipos de una sola vez, sin inventarle un puerto a cada uno; un equipo cuelga de UNA antena, porque asi funciona el WiFi. Se puede declarar a mano —con casillas, varios a la vez— y tambien se mide solo por tres caminos: la controladora WiFi, la tabla de asociados por SNMP de la propia antena, y el panel del aparato. El mapa lo dibuja con linea de puntos finos, distinta de las tres del cable, y cada enlace dice de donde salio."

[[sistema]]
version = "1.19"
revision = 30
fecha = "2026-08-15"
tipo = "feature"
modulo = "Credenciales de equipo"
notas = "El modulo 19: como se entra a cada aparato, guardado en el aparato. Usuario, clave, direccion del panel y notas en la ficha, para no buscarlos en un papel. La clave se guarda CIFRADA y la llave del cifrado vive con la configuracion, no con los datos: un respaldo de la base copiado a cualquier lado no trae con que abrirse. La clave no viaja en ningun listado —solo cuando alguien la pide, y queda anotado quien fue— y NUNCA sale en un mapa exportado. La misma credencial es la que MiRed usa para entrar al panel del aparato y leer su tabla de conectados: AirOS de Ubiquiti, RouterOS de MikroTik, TR-064 para los modems de Telmex, Totalplay e izzi, y un lector generico que saca las MAC de cualquier panel. De ahi, lo INALAMBRICO cuelga en el mapa; lo de cable no, porque el modem ve toda su LAN y colgarlo de el dibujaria una red plana donde hay un arbol."

[[sistema]]
version = "1.19"
revision = 31
fecha = "2026-08-15"
tipo = "change"
modulo = "Ficha del equipo"
notas = "Tocar un aparato —en la lista o en el mapa— abre SU FICHA, no un menu de acciones: en el mapa un clic es para mirar, y quitar un cable por accidente mientras se consulta la red estaba a un toque de distancia. La ficha tiene pestanas: Propiedades, Conexiones y —solo si el aparato se puede administrar— Credenciales. En Conexiones se ve que cuelga de el y POR QUE MEDIO: por cable, puerto por puerto, y por WiFi, en una lista sin numeros a la que se le agregan uno o varios equipos de una vez, porque el aire no tiene puertos. Un switch no administrable no muestra la pestana de credenciales: no tiene direccion, asi que no hay panel al que entrar, y ofrecer ese formulario seria ofrecer algo que no existe."

[[sistema]]
version = "1.19"
revision = 32
fecha = "2026-08-15"
tipo = "change"
modulo = "Mapa"
notas = "El mapa crece hacia la DERECHA: la entrada a la izquierda, en la segunda columna lo que cuelga de ella, en la tercera lo que cuelga de aquello, y los hermanos en lista hacia abajo. Se dibujaba de arriba abajo y en cuanto un switch tenia ocho puertos el plano se abria en abanico: las lineas se cruzaban y las cajas se salian de la pantalla. Una red se lee como se cablea. Ademas, el puerto por donde un aparato sube al de la izquierda ya no se dibuja como una caja aparte —esa conexion ES la linea que llega— y los arcos entre switches salen por la izquierda en vez de por arriba."

[[sistema]]
version = "1.19"
revision = 33
fecha = "2026-08-15"
tipo = "change"
modulo = "Mapa"
notas = "Cada enlace lleva SU color, y su etiqueta va del mismo color, EN MAYUSCULAS y del tamano del nombre del aparato. De un switch salen tantas lineas como puertos tenga, y todas del mismo gris con una etiqueta de once puntos no se pueden seguir con la vista: el dato que dice por donde entra cada cosa apenas se veia. Va igual en pantalla, en el SVG y en el PDF."

[[sistema]]
version = "1.19"
revision = 34
fecha = "2026-08-15"
tipo = "change"
modulo = "Escaneo"
notas = "MiRed corre en el equipo de alguien que lo esta usando para otra cosa, y se notaba. Tres cambios: mientras se EDITA el mapa, la agenda de esa red se para —ahi se declara cableado, no se mide, y un barrido por debajo solo gasta el equipo; la pausa se renueva sola mientras dura la edicion y vence sola si el programa se cierra de golpe—. Las cinco escuchas de red del reconocimiento (mDNS, UPnP, ONVIF, SADP y Tuya) van ahora a la vez y no una tras otra: eran quince segundos en fila esperando. Y se bajaron de 128 a 48 las conexiones simultaneas del barrido de puertos. Un barrido pedido a mano sigue lanzandose siempre: eso lo pidio una persona a proposito."

# ----------------------------------------------------------------- la base --
#
# Cada entrada apunta al numero de migracion que la trae. El esquema de las bases
# de red y el del catalogo se numeran aparte, asi que se dice cual es cual.

[[base]]
version = "1.14"
revision = 1
fecha = "2026-08-12"
tipo = "feature"
modulo = "Cimientos"
notas = "Catalogo 0001 y red 0001-0003: usuarios, permisos, sesiones, registro de redes, equipos, subredes, puertos y presencia."

[[base]]
version = "1.14"
revision = 2
fecha = "2026-08-12"
tipo = "feature"
modulo = "Mapa de puertos y alertas"
notas = "Red 0004-0008: equipos_snmp, interfaces, conexiones_puerto, enlaces, alertas y sus reglas, trafico por puerto y flujos del router."

[[base]]
version = "1.14"
revision = 3
fecha = "2026-08-13"
tipo = "feature"
modulo = "Consumo e inspeccion"
notas = "Red 0009-0010: columna estimado en trafico_flujos para distinguir lo muestreado de lo contado, y tabla trafico_aplicaciones para el consumo por aplicacion."

[[base]]
version = "1.14"
revision = 4
fecha = "2026-08-13"
tipo = "feature"
modulo = "Controladoras WiFi"
notas = "Catalogo 0003: tabla controladoras, con su ultimo exito y su ultimo error para que una controladora caida se vea en vez de desaparecer del mapa."

[[base]]
version = "1.14"
revision = 5
fecha = "2026-08-13"
tipo = "feature"
modulo = "Historial de versiones"
notas = "Catalogo 0004: tablas versionessistema y versiondb, que el servidor siembra al arrancar desde el historial que viaja dentro del binario."

[[base]]
version = "1.15"
revision = 7
fecha = "2026-08-14"
tipo = "feature"
modulo = "Equipos y catalogo"
notas = "Red 0012: columna categoria en equipos, la clave con la que se cuenta. `tipo` guarda el nombre para leer ('Impresora HP') y `categoria` la clave para contar ('impresora'): agrupando por nombre salian cubos separados para 'Impresora HP' e 'Impresora de red'. La migracion traduce al vocabulario nuevo lo que ya estaba declarado a mano, que usaba sus propias palabras."

[[base]]
version = "1.15"
revision = 6
fecha = "2026-08-14"
tipo = "feature"
modulo = "Topologia manual"
notas = "Red 0011: columnas modelo, origen y conexion en equipos, mas puertos_fisicos y enlaces_fisicos. El cable lleva su origen_dato —manual, snmp, lldp, cdp o inferido— para que lo tecleado no se confunda con lo medido. La tabla enlaces de 0004 NO se toca: aquella guarda lo que un switch anuncia de su vecino, esta guarda el cable ya resuelto."

[[base]]
version = "1.15"
revision = 8
fecha = "2026-08-15"
tipo = "change"
modulo = "Vocabulario"
notas = "Red 0013: la columna cuantos_en_boca de conexiones_puerto pasa a llamarse cuantos_en_puerto. La migracion 0004 no se toca —una migracion ya aplicada se queda como se aplico— y el cambio de nombre se hace aparte, para que una base vieja y una recien creada terminen exactamente iguales."

[[base]]
version = "1.15"
revision = 9
fecha = "2026-08-15"
tipo = "fix"
modulo = "Topologia manual"
notas = "Red 0014: indice unico por puerto de destino en enlaces_fisicos. La regla de un cable por puerto estaba a medias desde 0011, que solo cubria el puerto de origen: un mismo puerto podia recibir dos cables por el otro lado y el mapa dibujaba dos verdades incompatibles en el mismo lugar."

[[base]]
version = "1.15"
revision = 10
fecha = "2026-08-15"
tipo = "feature"
modulo = "Reconocimiento de aparatos"
notas = "Red 0015: tabla huellas, con lo que cada aparato dice de si mismo y de que fuente salio cada dato. La fuente se guarda con el dato a proposito: no vale lo mismo un modelo firmado en un certificado que uno sacado del titulo de una pagina."

[[base]]
version = "1.19"
revision = 11
fecha = "2026-08-15"
tipo = "feature"
modulo = "Enlaces inalambricos y credenciales"
notas = "Red 0016: tabla enlaces_inalambricos, con quien cuelga de que antena, el SSID, la senal y de donde salio el dato. Va aparte de enlaces_fisicos porque un enlace por el aire NO tiene puerto, y meterlo ahi obligaria a inventarle uno a cada telefono. Red 0017: tabla credenciales_equipo, con la clave cifrada; la llave vive con la configuracion, no con los datos."

[[sistema]]
version = "1.19"
revision = 35
fecha = "2026-08-15"
tipo = "change"
modulo = "Mapa"
notas = "Los cables van en CODO y no en diagonal: salen horizontales del aparato, bajan por su propio canal con la esquina redondeada y entran horizontales al de la derecha. En diagonal, un switch con varios puertos daba un abanico de rectas cruzadas donde no se podia seguir ninguna con la vista, y las etiquetas se juntaban todas en el mismo trozo del dibujo. La etiqueta del puerto pasa a ir pegada a la caja a la que entra el cable —alineada por la derecha, a su altura— asi que cada una queda junto a lo que nombra y dos nunca caen en el mismo renglon. El hueco entre columnas se ensancho para que quepan la bajada y el texto. El mismo recorrido lo dibujan la pantalla, el SVG y el PDF, sacado de una sola funcion: si cada uno lo calculara por su cuenta, el archivo exportado no seria el mapa que se vio."

[[base]]
version = "1.19"
revision = 36
fecha = "2026-08-15"
tipo = "change"
modulo = "Topologia manual"
notas = "Red 0018: un puerto ya no es solo LAN o WAN; tambien DMZ, SFP y CONSOLA. SQLite no sabe cambiar un CHECK, asi que hay que rehacer la tabla, y como enlaces_fisicos cuelga de puertos_fisicos con ON DELETE CASCADE, soltar la vieja con el hijo colgando se llevaria por delante TODOS los cables declarados: se rehacen las dos, se suelta primero el hijo, despues el padre —que ya no tiene a quien arrastrar— y al final se renombran. Hay una prueba que corre la migracion sobre las tablas de antes, con datos dentro, y comprueba que no se perdio ningun cable."

[[sistema]]
version = "1.19"
revision = 36
fecha = "2026-08-15"
tipo = "change"
modulo = "Mapa"
notas = "Un puerto se llama por su tipo y su numero —LAN 3, WAN 1, DMZ 1—, como esta rotulado en el aparato, y el mapa dice las DOS puntas del cable: «LAN 4 → LAN 5». Antes decia «PUERTO 4», que es la mitad del dato: en un modem con LAN, WAN y DMZ ni siquiera se sabia de que fila salia, y del otro extremo no se decia nada. Cuando la otra punta no tiene puertos declarados —una laptop, un DVR de un solo cable— se dice solo la de salida: inventarle un LAN 1 seria escribir en el mapa algo que nadie conto. Ademas, cada aparato se dibuja a la MISMA ALTURA que su primer hijo, no centrado en su franja: el modem quedaba flotando en medio de un hueco. Cada rama sigue reservando su franja entera, asi que dos ramas no se enciman nunca."

[[sistema]]
version = "1.19"
revision = 37
fecha = "2026-08-15"
tipo = "change"
modulo = "Mapa"
notas = "Todo aparato de punta —PC, TV, grabador, impresora— tiene su toma LAN 1, y el mapa la usa: «LAN 4 → LAN 1» en vez de media etiqueta. No es suponer, es como se conecta un aparato que no tiene mas que un cable; en cuanto alguien le declara puertos propios se deja de suponer y mandan los declarados. Dos limites: a un aparato que va por el aire NO se le supone toma —muchas laptops y tabletas ya ni traen conector de red, y dibujarles una LAN 1 seria inventarles un agujero— salvo que haya un cable declarado, que manda sobre la ficha; y a uno con varios puertos declarados no se le senala ninguno al azar. Ademas, la pestana Conexiones de un equipo de punta ya muestra esa toma con de que cuelga y por que puerto del otro lado: antes decia «no tiene puertos declarados» y nada mas, aunque el cable estuviera declarado desde el switch."

[[sistema]]
version = "1.19"
revision = 38
fecha = "2026-08-15"
tipo = "ajuste"
modulo = "Proyecto"
notas = "Puesta al dia del proyecto: la memoria refleja lo entregado —19 modulos, 207 pruebas en Go, 76 en Flutter y 63 comprobaciones de humo, donde decia 15 modulos y las cuentas de hace tres dias— y se anotan dos tripwires nuevos en gotchas: que rehacer una tabla en SQLite para cambiar un CHECK dispara los ON DELETE CASCADE de los hijos si se suelta el padre primero, y que un puerto se llama por su tipo y su numero. Tambien se corrige el comentario y la revision de respaldo de internal/version, que seguian diciendo 15 modulos y Rev 20; ese valor solo lo usa `go run`, porque al compilar de verdad lo fija construir.sh desde el historial."

[[sistema]]
version = "1.19"
revision = 39
fecha = "2026-08-17"
tipo = "change"
modulo = "Mapa"
notas = "Lo exportado se guarda DONDE DIGA EL USUARIO: al exportar el mapa se abre el cuadro de guardar del escritorio, con la carpeta de descargas solo como punto de partida. Antes el archivo caia derecho en Descargas y solo se avisaba de la ruta, asi que habia que ir a buscarlo y moverlo a mano a la carpeta del sitio. Y la hoja de calculo pasa a ser DOS TABLAS en vez de una: «Aparatos» —un renglon por aparato, con que es, de donde cuelga y con que certeza— y «Conexiones» —un renglon por conexion, cada cable UNA vez, con los puertos libres y lo que cuelga por el aire—. Se entregan en ODS y XLSX con una pestana por tabla, y en CSV con las dos seguidas. La tabla unica de antes no habia quien la leyera: cada renglon podia ser un puerto medido, uno declarado o un aparato sin ubicar, y las celdas vacias significaban «no aplica» en unas filas y «no se sabe» en otras; encima cada cable salia dos veces (una por punta), los aparatos por WiFi no salian —el WiFi no tiene puertos y la tabla recorria puertos— y los puertos se llamaban «puerto 3» cuando el mapa ya dice «LAN 3». Las dos tablas se arman del mismo arbol que dibuja el plano y en el mismo orden en que el mapa se lee. El ZIP del ODS y del XLSX se escribe a mano, como el PDF; la unica dependencia nueva es file_selector, el plugin oficial de Flutter para el cuadro de guardar."

[[base]]
version = "1.20"
revision = 40
fecha = "2026-08-17"
tipo = "feature"
modulo = "Equipos"
notas = "Red 0019: los equipos tienen columna `ubicacion`. Hasta ahora un aparato se sabia por su nombre, su IP y su MAC, y de donde COLGABA —su sitio en el cableado—, pero no DONDE ESTA: en que consultorio, en que oficina, en que rack. Sale de un caso real: la hoja de una clinica con 23 rosetas donde cada nodo se llamaba D01, D02, D03 y la unica forma de saber cual era cual era su columna UBICACION (farmacia, cons 5, reloj checador). Sin la columna ese dato solo cabia en las notas, revuelto con «se poncho de nuevo», y no se podia agrupar ni filtrar por sitio. Va en `equipos` y no en `equipos_snmp`: aquella la escribe el propio aparato cuando contesta SNMP, y esta la escribe una persona; un switch tonto no contesta nada y tambien esta en algun sitio."

[[sistema]]
version = "1.20"
revision = 40
fecha = "2026-08-17"
tipo = "feature"
modulo = "Importacion"
notas = "Modulo 20: subir una hoja de aparatos y meterla en la red de una vez. Una instalacion documentada en una hoja de calculo —el caso que lo motivo: una clinica con 23 rosetas, con su columna de puerto, nodo, ubicacion y observaciones— no se captura formulario por formulario. Se descarga una plantilla, se llena y se sube en CSV, ODS o XLSX, y de cada renglon salen el aparato, sus puertos, el cable que lo cuelga de su switch y hasta la credencial de su panel, cifrada. Son DOS pasos y el primero no escribe nada: la vista previa dice renglon por renglon lo que se haria y por que se rechaza lo que no se puede, con el numero de renglon del archivo para poder corregirlo; solo despues se aplica, y la aplicacion entera va en UNA transaccion. Lo que ya existe se puede actualizar o dejar como esta, y una celda vacia nunca borra lo que ya habia. Los tres formatos se leen con la biblioteca estandar de Go: un ODS y un XLSX son un ZIP con XML dentro. Se reconocen tambien encabezados de hojas ajenas (NODO, OBSERVACIONES, CONECTADO_A), el punto y coma que pone Excel en espanol y la marca de codificacion, para no tener que reescribir una hoja que lleva anos en uso."

[[sistema]]
version = "1.20"
revision = 41
fecha = "2026-08-17"
tipo = "change"
modulo = "Importacion"
notas = "Importar deja de ser un boton y pasa a ser una PANTALLA completa: para que sirve, los tres pasos, el campo del archivo con la plantilla al lado, y **la guia de llenado dentro de la propia pantalla** —columna por columna, con lo que se escribe, un ejemplo de verdad y los otros encabezados que tambien se aceptan; la lista cerrada de QUE_ES con sus apodos; los renglones de ejemplo; y las siete reglas que hay que saber (el switch tambien es un renglon, el orden da igual, el nombre no se repite, una celda vacia no borra, UBICACION no es CUELGA_DE, no hace falta reescribir la hoja, las claves se guardan cifradas)—. Quien llena la hoja tiene la guia delante mientras la llena, en vez de ir a buscar un manual aparte. La guia NO esta escrita en la pantalla: la manda el servidor desde la misma definicion con la que lee el archivo y arma la plantilla descargable, asi que el dia que se agregue una columna se entera sola. Antes eran dos verdades —la que el servidor acepta y la que la pantalla dice que acepta— y la segunda se descubre equivocada cuando alguien ya llenó la hoja."

[[sistema]]
version = "1.20"
revision = 42
fecha = "2026-08-17"
tipo = "change"
modulo = "Interfaz"
notas = "MiRed cambia de color: verde de terminal sobre negro, en vez del morado. No es solo la semilla del tema —los tonos van escritos a mano, porque `ColorScheme.fromSeed` descafeina el verde a menta pastel y saca un terciario AZUL girando la rueda de color, y un turquesa suelto rompe el conjunto en una herramienta que quiere parecer una terminal—. El rojo se queda rojo: es el unico color que no es verde en toda la aplicacion, porque un aviso de que algo se rompio no se pinta del color de la marca. De paso salen del codigo los cuatro colores fijos que quedaban (el verde de «presente», el del icono de la agenda y el rojo del modal de error), que ahora vienen del tema, y se borra `lib/main.dart` con su prueba: era la plantilla de ejemplo de Flutter, en ingles, con un contador y el morado original, y no la usaba nadie. Ademas, la barra de arriba del panel de redes se queda SOLO con lo que es de todo el programa —usuarios, catalogo, actualizar y la cuenta—; las credenciales SNMP y las controladoras WiFi se llegan ahora desde la pantalla de la red, que es donde se usan, y sus pantallas dicen en el titulo que lo que se toque ahi cambia para TODAS las redes, porque se guardan una sola vez."
